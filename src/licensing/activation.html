<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"><title>艾莲 · 软件激活</title><link rel="stylesheet" href="activation.css"></head>
<body><main><div class="eyebrow">ELLEN · DESKTOP COMPANION</div><h1>在这台电脑上遇见艾莲</h1><p class="intro">将机器码发给卖方，领取试玩或购买后的激活码。</p>
<section><div class="label-row"><label for="machine">这台电脑的机器码</label><button id="copy" type="button">复制机器码</button></div><output id="machine">正在读取…</output><p class="hint">授权与此电脑绑定。更换电脑或重装系统后，请联系卖方核对。</p></section>
<section><div class="label-row"><label for="token">激活码</label><button id="choose" type="button">导入授权文件</button></div><textarea id="token" rows="4" maxlength="8192" spellcheck="false" placeholder="在这里粘贴卖方发给你的激活码"></textarea><button id="activate" class="primary" disabled>验证并继续</button></section>
<p id="status" role="status" aria-live="polite">正在检查授权…</p><footer>激活不会清除已有聊天和记忆。<br>软件授权不包含聊天和语音 API 费用。</footer></main><script src="activation.js"></script></body></html>
