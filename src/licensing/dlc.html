<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"><title>艾莲 · DLC 授权</title><link rel="stylesheet" href="activation.css"><link rel="stylesheet" href="dlc.css"></head>
<body><main><div class="eyebrow">ELLEN · ADDITIONAL CONTENT</div><h1>DLC 授权</h1><p class="intro">购买扩展内容后，在这里导入卖方发给你的 DLC 激活码。</p>
<section><div class="label-row"><label for="machine">这台电脑的机器码</label><button id="copy" type="button">复制机器码</button></div><output id="machine">正在读取…</output></section>
<section><div class="label-row"><label for="token">DLC 激活码</label><button id="choose" type="button">导入授权文件</button></div><textarea id="token" rows="4" maxlength="8192" spellcheck="false" placeholder="粘贴 ELLENDLC1 开头的激活码"></textarea><button id="activate" class="primary" disabled>验证并保存授权</button></section>
<p id="status" role="status" aria-live="polite">正在读取 DLC 授权…</p>
<section><h2>本机已有授权</h2><p id="empty" class="hint">还没有导入 DLC 授权。</p><ul id="licenses"></ul></section>
<footer>本体与各项 DLC 授权分别保存，导入不会清除聊天或替换其他购买资格。<br>先激活，再下载内容；DLC 内容安装完成后可直接打开，不需要重启。</footer></main><script src="dlc.js"></script></body></html>
